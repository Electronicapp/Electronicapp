<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PRO</title>
    <style>
      :root {
        --bg: #0b1220;
        --card: #111827;
        --muted: #94a3b8;
        --text: #f8fafc;
        --gold: #facc15;
        --gold-2: #f59e0b;
        --green: #22c55e;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: radial-gradient(circle at top, #14213d 0%, var(--bg) 45%);
        color: var(--text);
        font-family: Cairo, Tahoma, Arial, sans-serif;
      }
      .wrap {
        width: min(92vw, 520px);
        background: rgba(17, 24, 39, 0.9);
        border: 1px solid rgba(148, 163, 184, 0.25);
        border-radius: 20px;
        box-shadow: 0 20px 50px rgba(0,0,0,0.35);
        padding: 28px 20px 20px;
      }
      h1 {
        margin: 0 0 18px;
        text-align: center;
        font-size: clamp(2.4rem, 6vw, 4rem);
        letter-spacing: 1px;
      }
      .pro-btn {
        width: 100%;
        border: none;
        border-radius: 999px;
        background: linear-gradient(135deg, var(--gold), var(--gold-2));
        color: #111827;
        font-size: 1.35rem;
        font-weight: 900;
        padding: 16px 24px;
        cursor: pointer;
        box-shadow: 0 10px 25px rgba(250, 204, 21, 0.45);
      }
      .sub {
        margin-top: 16px;
        font-size: 0.92rem;
        color: var(--muted);
        text-align: center;
      }
      .modal {
        position: fixed;
        inset: 0;
        display: none;
        align-items: center;
        justify-content: center;
        background: rgba(2, 6, 23, 0.7);
        backdrop-filter: blur(3px);
        z-index: 999;
        padding: 20px;
      }
      .modal.open {
        display: flex;
      }
      .panel {
        width: min(92vw, 420px);
        background: #ffffff;
        color: #0f172a;
        border-radius: 18px;
        padding: 22px 20px 18px;
        box-shadow: 0 25px 60px rgba(0,0,0,0.35);
      }
      .panel h2 {
        margin: 0 0 12px;
        text-align: center;
        font-size: 2rem;
      }
      .panel p {
        margin: 0 0 18px;
        color: #475569;
        text-align: center;
        line-height: 1.7;
      }
      .wa-list {
        display: grid;
        gap: 10px;
      }
      .wa {
        display: block;
        text-decoration: none;
        background: linear-gradient(135deg, #22c55e, #16a34a);
        color: white;
        font-weight: 700;
        border-radius: 12px;
        padding: 12px 14px;
        text-align: center;
      }
      .close {
        position: absolute;
        top: 12px;
        left: 12px;
        border: none;
        background: rgba(255,255,255,0.15);
        color: white;
        width: 36px;
        height: 36px;
        border-radius: 50%;
        font-size: 1.3rem;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>PRO</h1>
      <button class="pro-btn" id="proBtn" type="button">PRO</button>
      <div class="sub">للتواصل مباشرة عبر واتساب</div>
    </div>

    <div class="modal" id="proModal" aria-hidden="true">
      <div class="panel" role="dialog" aria-modal="true">
        <button class="close" id="closeBtn" type="button" aria-label="إغلاق">×</button>
        <h2>PRO</h2>
        <p>تواصل معنا مباشرة على واتساب للحصول على نسخة PRO.</p>
        <div class="wa-list">
          <a class="wa" href="https://wa.me/201287837118" target="_blank" rel="noreferrer">واتساب • 01287837118</a>
          <a class="wa" href="https://wa.me/201558837118" target="_blank" rel="noreferrer">واتساب • 01558837118</a>
        </div>
      </div>
    </div>

    <script>
      const proBtn = document.getElementById('proBtn');
      const modal = document.getElementById('proModal');
      const closeBtn = document.getElementById('closeBtn');

      proBtn.addEventListener('click', () => {
        modal.classList.add('open');
        modal.setAttribute('aria-hidden', 'false');
      });

      closeBtn.addEventListener('click', () => {
        modal.classList.remove('open');
        modal.setAttribute('aria-hidden', 'true');
      });

      modal.addEventListener('click', (event) => {
        if (event.target === modal) {
          modal.classList.remove('open');
          modal.setAttribute('aria-hidden', 'true');
        }
      });
    </script>
  </body>
</html>
